name: Build & Package DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tạo GitHub Release (nhập tag ví dụ v2.9.2, bắt buộc)'
        required: true
        default: 'v2.9.2'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build macOS App & DMG
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Danh sách Xcode có sẵn trên máy ảo:"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project NotchPulse.xcodeproj

      - name: Build App (Ad-Hoc Signing, No Paid Apple Cert Required)
        run: |
          xcodebuild clean build \
            -project NotchPulse.xcodeproj \
            -scheme NotchPulse \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Verify Built App
        run: |
          if [ ! -d "build/Build/Products/Release/NotchPulse.app" ]; then
            echo "::error::Không tìm thấy NotchPulse.app sau khi build!"
            exit 1
          fi
          echo "Build thành công NotchPulse.app!"

      - name: Create DMG & ZIP Packages
        run: |
          mkdir -p release_out
          mkdir -p dmg_staging

          # Copy .app vào thư mục staging và đặt tên là NotchPulse.app
          cp -R build/Build/Products/Release/NotchPulse.app dmg_staging/NotchPulse.app

          # Ký đồng bộ toàn bộ app bundle và embedded frameworks/services bằng ad-hoc signing (-)
          codesign --force --deep --sign - dmg_staging/NotchPulse.app
          
          # Nén file .app dạng zip với ditto (giữ nguyên quyền và resource macOS)
          ditto -c -k --keepParent dmg_staging/NotchPulse.app release_out/NotchPulse.app.zip

          # Tạo symlink Applications để người dùng kéo thả
          ln -s /Applications dmg_staging/Applications

          sync
          sleep 2

          # Tạo file .dmg bằng hdiutil native chuẩn macOS (kèm retry phòng ngừa Resource busy)
          for attempt in 1 2 3; do
            if hdiutil create -volname "NotchPulse" -srcfolder dmg_staging -ov -format UDZO release_out/NotchPulse.dmg; then
              echo "Tạo DMG thành công ở lần thử $attempt"
              break
            else
              echo "hdiutil bận, thử lại sau 3s (lần $attempt/3)..."
              sleep 3
            fi
          done

          echo "Đã đóng gói xong:"
          ls -lh release_out/

      - name: Upload DMG Artifact (Tải trực tiếp từ GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: NotchPulse.dmg
          path: release_out/NotchPulse.dmg
          if-no-files-found: error

      - name: Upload App ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchPulse.app.zip
          path: release_out/NotchPulse.app.zip
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.9.2"
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "Publishing release $TAG..."

          sed "s/{{COMMIT_SHA}}/${{ github.sha }}/g" RELEASE_NOTES.md > current_release_notes.md

          gh release create "$TAG" release_out/NotchPulse.dmg release_out/NotchPulse.app.zip \
            --title "NotchPulse $TAG" \
            --notes-file current_release_notes.md \
            --draft=false \
            --prerelease=false || \
          gh release edit "$TAG" --title "NotchPulse $TAG" --notes-file current_release_notes.md || \
          gh release upload "$TAG" release_out/NotchPulse.dmg release_out/NotchPulse.app.zip --clobber
