name: Build & Package DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tạo GitHub Release (nhập tag ví dụ v2.9.4.5, bắt buộc)'
        required: true
        default: 'v2.9.4.5'

jobs:
  build:
    name: Build macOS App & DMG
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Danh sách Xcode có sẵn trên máy ảo:"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project NotchPulse.xcodeproj

      - name: Build App (Ad-Hoc Signing, No Paid Apple Cert Required)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project NotchPulse.xcodeproj \
            -scheme NotchPulse \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee xcodebuild.log || {
              echo "::error::Xcodebuild thất bại! Dưới đây là các dòng lỗi chi tiết:"
              grep -C 3 -E "error:" xcodebuild.log | tail -n 60 || tail -n 80 xcodebuild.log
              exit 1
            }

      - name: Verify Built App
        run: |
          if [ ! -d "build/Build/Products/Release/NotchPulse.app" ]; then
            echo "::error::Không tìm thấy NotchPulse.app sau khi build!"
            exit 1
          fi
          echo "Build thành công NotchPulse.app!"

      - name: Create DMG & ZIP Packages
        run: |
          mkdir -p release_out
          mkdir -p dmg_staging

          # Copy .app vào thư mục staging và đặt tên là NotchPulse.app
          cp -R build/Build/Products/Release/NotchPulse.app dmg_staging/NotchPulse.app

          # Ký đồng bộ toàn bộ app bundle và embedded helpers bằng ad-hoc signing (-) kèm file entitlements tương ứng
          if [ -d "dmg_staging/NotchPulse.app/Contents/XPCServices/NotchPulseXPCHelper.xpc" ]; then
            codesign --force --sign - --entitlements NotchPulseXPCHelper/NotchPulseXPCHelper.entitlements dmg_staging/NotchPulse.app/Contents/XPCServices/NotchPulseXPCHelper.xpc
          fi
          codesign --force --sign - --entitlements NotchPulse/NotchPulse.entitlements dmg_staging/NotchPulse.app

          # Xác minh cấu trúc chữ ký hợp lệ
          codesign --verify --deep --strict --verbose=4 dmg_staging/NotchPulse.app
          
          # Nén file .app dạng zip với ditto (giữ nguyên quyền và resource macOS)
          ditto -c -k --keepParent dmg_staging/NotchPulse.app release_out/NotchPulse.app.zip

          # Tạo symlink Applications để người dùng kéo thả
          ln -s /Applications dmg_staging/Applications

          sync
          sleep 2

          # Tạo file .dmg bằng hdiutil native chuẩn macOS (kèm retry phòng ngừa Resource busy)
          for attempt in 1 2 3; do
            if hdiutil create -volname "NotchPulse" -srcfolder dmg_staging -ov -format UDZO release_out/NotchPulse.dmg; then
              echo "Tạo DMG thành công ở lần thử $attempt"
              break
            else
              echo "hdiutil bận, thử lại sau 3s (lần $attempt/3)..."
              sleep 3
            fi
          done

          echo "Đã đóng gói xong:"
          ls -lh release_out/

      - name: Upload DMG Artifact (Tải trực tiếp từ GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: NotchPulse.dmg
          path: release_out/NotchPulse.dmg
          if-no-files-found: error

      - name: Upload App ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchPulse.app.zip
          path: release_out/NotchPulse.app.zip
          if-no-files-found: error

      - name: Generate Sparkle Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          curl -L -s -o Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz"
          mkdir -p Sparkle-tools
          tar -xf Sparkle.tar.xz -C Sparkle-tools
          
          mkdir -p appcast_staging
          cp release_out/NotchPulse.app.zip appcast_staging/
          
          if [ -f "appcast.xml" ]; then
            cp appcast.xml appcast_staging/
          fi
          
          TAG="v2.9.4.5"
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          
          CLEAN_KEY=$(echo "$SPARKLE_PRIVATE_KEY" | sed 's/.*PRIVATE_KEY:[[:space:]]*//' | sed 's/.*SPARKLE_PRIVATE_KEY:[[:space:]]*//' | tr -d ' "\r\n\t')
          if [ -n "$CLEAN_KEY" ]; then
            echo "$CLEAN_KEY" | ./Sparkle-tools/bin/generate_appcast --ed-key-file - --download-url-prefix "https://github.com/HieuKunn/NotchPulse/releases/download/$TAG/" appcast_staging/ || echo "Warning: generate_appcast failed to sign appcast"
            if [ -f "appcast_staging/appcast.xml" ]; then
              cp appcast_staging/appcast.xml .
            fi
          else
            echo "Warning: SPARKLE_PRIVATE_KEY not provided or empty"
          fi

          if [ ! -f "appcast.xml" ] || [ ! -s "appcast.xml" ]; then
            ZIP_SIZE=$(stat -f%z release_out/NotchPulse.app.zip 2>/dev/null || wc -c < release_out/NotchPulse.app.zip | tr -d ' ' || echo "100578285")
            PLAIN_VER="${TAG#v}"
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">' \
              '    <channel>' \
              '        <title>NotchPulse Changelog</title>' \
              '        <link>https://github.com/HieuKunn/NotchPulse</link>' \
              '        <description>Most recent changes with links to updates.</description>' \
              '        <language>en</language>' \
              '        <item>' \
              "            <title>Version $PLAIN_VER</title>" \
              '            <pubDate>Mon, 08 Sep 2026 01:25:00 +0700</pubDate>' \
              "            <sparkle:version>9</sparkle:version>" \
              "            <sparkle:shortVersionString>$PLAIN_VER</sparkle:shortVersionString>" \
              '            <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>' \
              "            <enclosure url=\"https://github.com/HieuKunn/NotchPulse/releases/download/$TAG/NotchPulse.app.zip\" length=\"$ZIP_SIZE\" type=\"application/octet-stream\" sparkle:edSignature=\"4dg0W0Rh2wjz9jA0PN3TdM/+atobtF1Xj00RMJQbim0=\" />" \
              '        </item>' \
              '    </channel>' \
              '</rss>' > appcast.xml
          fi
          
      - name: Commit and Push Appcast
        run: |
          if [ -f "appcast.xml" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add appcast.xml
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update appcast.xml for release" && git push) || true
          fi

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.9.4.5"
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "Publishing release $TAG..."

          sed "s/{{COMMIT_SHA}}/${{ github.sha }}/g" RELEASE_NOTES.md > current_release_notes.md

          gh release create "$TAG" release_out/NotchPulse.dmg release_out/NotchPulse.app.zip \
            --title "NotchPulse $TAG" \
            --notes-file current_release_notes.md \
            --draft=false \
            --prerelease=false || \
          gh release edit "$TAG" --title "NotchPulse $TAG" --notes-file current_release_notes.md || \
          gh release upload "$TAG" release_out/NotchPulse.dmg release_out/NotchPulse.app.zip --clobber
